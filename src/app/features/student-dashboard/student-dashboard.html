<div class="dashboard">
  <h1>Welcome, {{ studentName() }}</h1>

  <p>Credits Earned: {{ earnedCredits() }}</p>

  <p>Graduation Status: {{ graduationStatus() }}</p>

  <button (click)="registerForClass()">Register for a Class (+3 credits)</button>
</div>

<h2>Course Catalog</h2>

<div class="grid">
  @for (course of courseStore.entities(); track course.id) {
    <tms-course-card
      [course]="course"
      (enrollClicked)="handleEnroll($event)"
      (deleteClicked)="handleDelete($event)"
    />
  } @empty {
    <p>No courses are available this term.</p>
  }
</div>

@if (courseStore.error()) {
  <div class="error">
    {{ courseStore.error() }}
  </div>
}
