<mat-card>
  <mat-card-header>
    <mat-card-title>Access Denied</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>You don’t have permission to view this resource.</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" type="button" (click)="goToLogin()">
      Go to Login
    </button>
  </mat-card-actions>
</mat-card>
