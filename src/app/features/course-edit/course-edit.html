<div class="course-edit-page">
  <div class="edit-header">
    <div>
      <p class="eyebrow">COURSE MANAGEMENT</p>

      <h1>Edit Course</h1>

      <p>Update the course information below.</p>
    </div>
  </div>

  @if (loading()) {
    <div class="state-message">Loading course...</div>
  }

  @if (errorMessage()) {
    <div class="error-message">
      {{ errorMessage() }}
    </div>
  }

  @if (!loading()) {
    <div class="edit-card">
      <div class="form-group">
        <label for="code"> Course Code </label>

        <input id="code" type="text" [(ngModel)]="code" placeholder="Example: CSE-301" />
      </div>

      <div class="form-group">
        <label for="title"> Course Title </label>

        <input id="title" type="text" [(ngModel)]="title" placeholder="Enter course title" />
      </div>

      <div class="form-group">
        <label for="maxCapacity"> Maximum Capacity </label>

        <input
          id="maxCapacity"
          type="number"
          [(ngModel)]="maxCapacity"
          min="{{ enrollmentCount }}"
        />

        <small>
          Current enrolled students:
          {{ enrollmentCount }}
        </small>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancel()" [disabled]="saving()">
          Cancel
        </button>

        <button type="button" class="btn-save" (click)="save()" [disabled]="saving()">
          @if (saving()) {
            Saving...
          } @else {
            Save Changes
          }
        </button>
      </div>

      @if (successMessage()) {
        <div class="success-message">
          {{ successMessage() }}
        </div>
      }
    </div>
  }
</div>
